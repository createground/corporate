<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お問い合わせ｜CREATE GROUND</title>
<meta name="description" content="合同会社クリエイトグラウンドへのお問い合わせ。お電話・FAX・フォームにて承ります。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=7">
</head>
<body data-root="./">

<div class="hero sub">
  <div class="bg" style="background-image:url(https://images.unsplash.com/photo-1728877648326-1e571d43c32b?auto=format&fit=crop&w=2000&q=75)"></div>
  <div class="wrap">
    <div class="label">CONTACT</div>
    <h1>お問い合わせ</h1>
    <p>お電話・FAX・フォームにて承ります。</p>
  </div>
</div>

<section class="tight">
  <div class="wrap">
    <div class="ccards">
      <div class="ccard rv">
        <span class="ic" data-ic="talk"></span>
        <h3>お電話</h3>
        <a class="big" href="tel:0345639965">03-4563-9965</a>
        <p>平日 10:00 〜 18:00</p>
      </div>
      <div class="ccard rv">
        <span class="ic" data-ic="doc"></span>
        <h3>FAX</h3>
        <span class="big">03-6630-2527</span>
        <p>24時間受付</p>
      </div>
      <div class="ccard rv">
        <span class="ic" data-ic="office"></span>
        <h3>所在地</h3>
        <span class="big" style="font-size:18px;line-height:1.6">東京都目黒区下目黒<br>1丁目1番14号 コノトラビル7F</span>
        <p>〒153-0064</p>
      </div>
    </div>
  </div>
</section>

<section class="gray">
  <div class="wrap" style="max-width:760px">
    <div class="sec-head center rv" style="margin-bottom:44px">
      <div class="en">Form</div>
      <h2 class="h2" style="font-size:30px">フォームからのお問い合わせ</h2>
      <p class="body" style="margin-top:14px">2営業日以内にご連絡いたします。</p>
    </div>

    <form class="rv" action="https://formsubmit.co/createground.corp@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="【サイト】お問い合わせが届きました">
      <input type="hidden" name="_template" value="table">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="https://create-ground.com/thanks.html">
      <input type="text" name="_honey" style="display:none">

      <label>お問い合わせ種別
        <select id="type" name="お問い合わせ種別">
          <option value="不動産事業（法人社宅）について">不動産事業（法人社宅）について</option>
          <option value="住まいのご相談（入居希望）">住まいのご相談（入居希望）</option>
          <option value="物件のご提供・お取引">物件のご提供・お取引</option>
          <option value="経営改善・事業再生のご相談">経営改善・事業再生のご相談</option>
          <option value="AI研修・開発・講演のご依頼">AI研修・開発・講演のご依頼</option>
          <option value="その他">その他</option>
        </select>
      </label>
      <label>会社名<input type="text" name="会社名"></label>
      <label>お名前<small>必須</small><input type="text" name="お名前" required></label>
      <label>メールアドレス<small>必須</small><input type="email" name="メールアドレス" required></label>
      <label>電話番号<input type="tel" name="電話番号"></label>
      <label>お問い合わせ内容<small>必須</small><textarea name="お問い合わせ内容" required></textarea></label>
      <p class="note">ご入力いただいた内容は、<a href="privacy.html">プライバシーポリシー</a>に基づき取り扱います。</p>
      <button class="btn">送信する →</button>
    </form>
  </div>
</section>

<script src="assets/common.js?v=7"></script>
<script>
  var t = new URLSearchParams(location.search).get('type');
  var map = { housing: 0, resident: 1, owner: 2, consulting: 3, ai: 4, other: 5 };
  if (t && map[t] !== undefined) document.getElementById('type').selectedIndex = map[t];
</script>
</body>
</html>
